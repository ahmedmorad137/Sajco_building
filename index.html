<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير تحديث البرنامج الزمني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#0d5c33;--g2:#2a9d5c;--gold:#c48f24;--red:#b3261e;--bg:#f2f1ec;--t:#1b2a22;--mut:#6b7a71;--line:#e3e1d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.6 Cairo,Tahoma,sans-serif}
header{background:linear-gradient(120deg,#083d22,#0f7a43);color:#fff;padding:18px 16px}header .in{max-width:1100px;margin:auto;display:flex;gap:14px;align-items:center}
header img{width:62px;height:62px;border-radius:50%;background:#fff;padding:3px}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:12px;opacity:.8}
.w{max-width:1100px;margin:auto;padding:14px}.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button,select,input{font:inherit}button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}button.s{background:#fff;color:var(--g);border:1px solid var(--g2)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{background:#fff;color:var(--g);border:1px solid var(--g2);white-space:nowrap}.tabs .on{background:var(--g);color:#fff}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tb input,.tb select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-width:0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k div{background:#f8f7f2;border-radius:12px;padding:10px 12px}.k b{display:block;font-size:24px}.k span{color:var(--mut);font-size:12px}
.bar{height:10px;background:#e8e6dc;border-radius:6px;position:relative;overflow:hidden}.bar i{position:absolute;top:0;bottom:0;right:0;background:var(--g2)}.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#222}
.zr{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}summary{padding:12px 14px;cursor:pointer;font-weight:700;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
summary .n{background:var(--red);color:#fff;border-radius:20px;padding:0 10px;font-size:12px}summary small{color:var(--mut);font-weight:400}
.zh{background:#f0efe7;padding:6px 14px;font-weight:700;font-size:13px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}td.a{white-space:normal;min-width:200px}th{color:var(--mut);font-weight:600}.r{color:var(--red);font-weight:700}
.gt{overflow-x:auto;direction:ltr;border:1px solid var(--line);border-radius:12px;background:#fff}.gr{display:flex;border-bottom:1px solid var(--line);height:26px;align-items:center}.gr>span{position:sticky;left:0;z-index:2;background:#fff;width:var(--lw);flex:none;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;direction:rtl;text-align:right;border-right:1px solid var(--line)}
.gr.h>span{background:#f0efe7;font-weight:700}.gr.h{background:#f0efe7}.tr{position:relative;height:100%;flex:none}.gb{position:absolute;top:6px;height:14px;border-radius:4px;background:#d9d6c8;overflow:hidden}.gb b{position:absolute;left:0;top:0;bottom:0}.gb u{position:absolute;top:0;bottom:0;width:2px;background:#111}.cl{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:1}.mo{position:absolute;top:4px;font-size:11px;color:var(--mut)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 10px}.lg i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-left:4px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 10px 30px;direction:ltr}.err{color:var(--red)}
@media(max-width:640px){:root{--lw:120px!important}.zr{grid-template-columns:1fr 1fr}.zr .bar{grid-column:1/-1;order:3}header h1{font-size:16px}}
</style></head><body>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],P=v=>Math.round(v*100)+'%',fd=s=>{const[y,m,d]=s.split('-');return '<bdi>'+d+'-'+MO[m-1]+'-'+y+'</bdi>'},fp=s=>fd(s).replace(/<\/?bdi>/g,'');
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const iso=d=>{const t=new Date(d.getTime()+43200000);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const nk=s=>String(s??'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function grid(ws){let m=0;for(const k in ws)if(k[0]!='!'){const n=+k.replace(/\D/g,'');if(n>m)m=n}ws['!ref']='A1:S'+m;return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null})}
const hdr=g=>{const i=g.findIndex(r=>String(r[0]??'').trim().toLowerCase()=='id');if(i<0)return null;const h={};g[i].forEach((x,j)=>{if(x!=null)h[String(x).trim().toLowerCase()]=j});return{i,h}};
const fc=(h,k)=>{for(const n in h)if(n.includes(k))return h[n];return -1};
let PS=null,DATA=null,TAB='c',F={e:'',q:'',late:false};
async function parse(files){const S=new Map(),Z=new Map(),T=new Map();let cut=null,title='',nT=0;
 for(const f of files){const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  for(const n of wb.SheetNames){const g=grid(wb.Sheets[n]),H=hdr(g);if(!H)continue;const{h,i}=H,c=k=>fc(h,k);
   if(c('executed')>=0){if(g[4]&&g[4][1] instanceof Date)cut=iso(g[4][1]);title=String(g[2]?.[0]??'');let grp='';
    for(const r of g.slice(i+1)){if(r[0]==null)continue;if(r[c('activity')]==null){grp=String(r[0]).trim();continue}const id=+r[0];if(!id)continue;
     const dv=k=>r[c(k)] instanceof Date?iso(r[c(k)]):null;
     S.set(id,{id,a:r[c('activity')],u:r[c('unit')],tot:+r[c('total q')]||0,ex:+r[c('executed')]||0,st:dv('start'),fn:dv('finish'),eng:r[c('responsib')],sub:r[c('subcontractor')],s:grp})}}
   else if(c('planned qty')>=0){nT++;for(const r of g.slice(i+1)){const id=+r[0];if(id)T.set(id,{ac:r[c('actual')],z:r[c('main')],s:r[c('sub-zone')],eng:r[c('responsib')],sub:r[c('subcontractor')]})}}
   else if(c('main zone')>=0&&c('start')<0){for(const r of g.slice(i+1)){const id=+r[0];if(id)Z.set(id,{z:r[c('main')],s:r[c('sub-zone')]})}}}}
 if(!S.size)throw Error('ملف البرنامج الزمني (Activities) مش موجود بين الملفات');return{S,Z,T,cut,title,nT}}
function build(p,cut){const dd=dn(cut),rows=[];
 for(const s of p.S.values()){if(!s.st||!s.fn)continue;const t=p.T.get(s.id)||{},z=p.Z.get(s.id)||{},a=dn(s.st),b=dn(s.fn),d=b-a+1;
  let ac=t.ac!=null&&t.ac!==''?+t.ac:(s.tot?s.ex/s.tot:0);ac=Math.max(0,Math.min(1,ac||0));
  rows.push({id:s.id,a:s.a,z:String(t.z||z.z||'—').trim(),s:String(t.s||z.s||s.s||'—').trim(),st:s.st,fn:s.fn,d,pl:dd<a?0:dd>=b?1:(dd-a+1)/d,ac,eng:String(t.eng||s.eng||'').trim(),sub:t.sub??s.sub??''})}
 const cnt={};rows.forEach(r=>{const k=nk(r.sub);(cnt[k]=cnt[k]||{})[r.sub]=(cnt[k][r.sub]||0)+1});
 rows.forEach(r=>{const k=nk(r.sub);r.sub=(!k||k=='0')?'غير محدد':Object.entries(cnt[k]).sort((x,y)=>y[1]-x[1])[0][0].toString().trim()});
 return{title:p.title,cut,rows}}
const st=r=>r.ac>=.999?'d':r.pl-r.ac>.005?'l':r.pl==0&&r.ac==0?'n':'p';
const col=r=>({d:'#0d5c33',l:'#b3261e',n:'#9aa59d',p:'#2a9d5c'}[st(r)]);
const W=(rows,k)=>{const t=rows.reduce((a,r)=>a+r.d,0)||1;return rows.reduce((a,r)=>a+r.d*r[k],0)/t};
function view(d){DATA=d;$('#ttl').textContent='تقرير تحديث البرنامج الزمني';$('#sub').innerHTML=esc(d.title||'')+' · '+fd(d.cut);draw()}

 const tabs=`<div class="tabs">${[['c','المقاولين المتأخرين'],['g','البرنامج الزمني'],['s','ملخص المشروع']].map(([k,t])=>`<button class="${TAB==k?'on':''}" onclick="TAB='${k}';draw()">${t}</button>`).join('')}</div>`;
 $('#rep').innerHTML=`<div class="c"><div class="k"><div><b>${P(pl)}</b><span>المخطط حتى ${fd(DATA.cut)}</span></div><div><b>${P(ac)}</b><span>الفعلي</span></div><div><b dir="ltr" class="${ac<pl?'r':''}">${ac-pl>0?'+':''}${((ac-pl)*100).toFixed(1)}%</b><span>الفرق</span></div><div><b>${L.length}</b><span>بند متأخر من ${R.length}</span></div><div><b>${R.filter(r=>st(r)=='d').length}</b><span>بند مكتمل</span></div></div></div>`+tabs+(TAB=='s'?'':tb)+'<div id="v"></div>';
 $('#v').innerHTML=TAB=='c'?vc():TAB=='g'?vg():vs()}
function vs(){const m={};DATA.rows.forEach(r=>(m[r.z]=m[r.z]||[]).push(r));
 return '<div class="c"><b>التقدم حسب المنطقة</b>'+Object.entries(m).map(([z,a])=>{const p=W(a,'pl'),c=W(a,'ac');return `<div class="zr"><span>${esc(z)} <small>(${a.length})</small></span><div class="bar"><i style="width:${c*100}%"></i><u style="right:${p*100}%"></u></div><span class="${c<p?'r':''}">${P(c)} / ${P(p)}</span></div>`}).join('')+'<p style="color:var(--mut);font-size:12px">الشريط = الفعلي، الخط الأسود = المخطط.</p></div>'}
function vc(){const L=flt().filter(r=>st(r)=='l'),m={};L.forEach(r=>(m[r.sub]=m[r.sub]||[]).push(r));

 return `<div class="lg"><span><i style="background:#0d5c33"></i>مكتمل</span><span><i style="background:#2a9d5c"></i>ماشي</span><span><i style="background:#b3261e"></i>متأخر</span><span><i style="background:#9aa59d"></i>لسه</span><span><i style="background:#111;width:3px"></i>المخطط</span><span><i style="background:var(--gold);width:3px"></i>تاريخ التقرير</span></div><div class="gt" style="--lw:${lw}px">${h}</div>`}
